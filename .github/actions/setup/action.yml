name: Rust kurulumu
description: rust-toolchain.toml'daki araç zinciri, önbellek ve kalite kapısı araçları.
inputs:
  gate-tools:
    description: Kalite kapısı cargo araçlarını kur (verify işi için).
    default: "false"
runs:
  using: composite
  steps:
    - name: rustup
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Araç zinciri (rust-toolchain.toml)
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - name: Önbellek
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Kapı araçları
      if: inputs.gate-tools == 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-nextest@0.9.148,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-machete@0.9.2,cargo-hack@0.6.45
