schema_version = 1

[server]
listen = "0.0.0.0:7878"

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
model = "meta/llama-3.3-70b-instruct"
capabilities = ["tools"]
requests_per_minute = 40
timeout_seconds = 60

[roles]
planner = "nvidia"
fast = "nvidia"
